<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双摆模拟器 · 混沌仿真</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #14141c;
    color: #dcdce8;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #app { display: flex; height: 100%; }

  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #canvasWrap { flex: 1; min-height: 0; position: relative; }
  #cv { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #cv.dragging { cursor: grabbing; }

  #bar {
    flex: none;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 13px 18px;
    background: #1b1b26;
    border-top: 1px solid #2e2e3d;
  }
  #bar .item { display: flex; align-items: center; gap: 10px; flex: 1 1 200px; min-width: 190px; }
  #bar .item .lb { font-size: 12px; color: #a8a8c0; white-space: nowrap; }
  #bar .item input[type=range] { flex: 1; min-width: 80px; }
  #bar .item .vv {
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 12px; color: #67e8f9; min-width: 64px; text-align: right;
  }
  #bar button { flex: none; padding: 9px 20px; }

  #panel {
    width: 300px; flex: none;
    background: #1f1f2b;
    border-left: 1px solid #2e2e3d;
    padding: 20px 18px;
    display: flex; flex-direction: column; gap: 18px;
    overflow-y: auto;
  }
  h1 { font-size: 17px; font-weight: 600; letter-spacing: .5px; color: #eef; }
  h1 small { display: block; margin-top: 4px; font-size: 11px; font-weight: 400; color: #6f6f88; letter-spacing: 0; }

  .readout { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cell {
    background: #191922; border: 1px solid #2a2a38; border-radius: 8px; padding: 8px 10px;
  }
  .cell .k { font-size: 10px; color: #6f6f88; letter-spacing: .5px; }
  .cell .v {
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 14px; color: #67e8f9; margin-top: 3px;
  }

  .group { display: flex; flex-direction: column; gap: 12px; }
  .row label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: #a8a8c0; margin-bottom: 6px;
  }
  .row label b {
    font-family: ui-monospace, Consolas, monospace;
    font-weight: 500; color: #eef; font-size: 12px;
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 2px; background: #2c2c3a; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #67e8f9; border: none; cursor: pointer;
    box-shadow: 0 0 8px rgba(103,232,249,.55);
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #67e8f9; border: none; cursor: pointer;
    box-shadow: 0 0 8px rgba(103,232,249,.55);
  }

  .btns { display: flex; gap: 8px; }
  button {
    flex: 1; padding: 9px 0;
    background: #262633; color: #dcdce8;
    border: 1px solid #35354a; border-radius: 8px;
    font-size: 12px; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  button:hover { background: #2f2f40; border-color: #45455e; }
  button:active { background: #232331; }

  .tip {
    font-size: 11px; line-height: 1.7; color: #6f6f88;
    border-top: 1px solid #2a2a38; padding-top: 12px;
  }
  .tip kbd {
    background: #262633; border: 1px solid #35354a; border-radius: 4px;
    padding: 0 5px; font-family: ui-monospace, Consolas, monospace; font-size: 10px;
  }

  .presets-label { font-size: 12px; color: #a8a8c0; margin-bottom: 8px; }
  .bodies { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .body-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px;
    background: #1a1a26; color: #dcdce8;
    border: 1px solid #35354a; border-radius: 8px;
    font-size: 12px; cursor: pointer; font-family: inherit;
    transition: background .15s, border-color .15s, box-shadow .15s;
  }
  .body-btn:hover { background: #262635; border-color: #45455e; }
  .body-btn.active {
    background: #232336; border-color: #67e8f9;
    box-shadow: 0 0 0 1px #67e8f9 inset, 0 0 10px rgba(103,232,249,.15);
  }
  .body-btn .dot {
    width: 10px; height: 10px; border-radius: 50%; flex: none;
    box-shadow: 0 0 6px currentColor;
  }
  .body-btn .name { flex: 1; text-align: left; }
  .body-btn .gv {
    font-family: ui-monospace, Consolas, monospace;
    color: #6f6f88; font-size: 10px;
  }

  @media (max-width: 760px) {
    #app { flex-direction: column; }
    #panel { width: 100%; border-left: none; border-top: 1px solid #2e2e3d; max-height: 46%; }
  }
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <div id="canvasWrap"><canvas id="cv"></canvas></div>

    <div id="bar">
      <div class="item">
        <span class="lb">摆长 (L₁=L₂)</span>
        <input type="range" id="b-len" min="100" max="350" step="1" value="200">
        <span class="vv" id="b-len-v">200 px</span>
      </div>
      <div class="item">
        <span class="lb">重力</span>
        <input type="range" id="b-grv" min="0" max="25" step="0.1" value="9.8">
        <span class="vv" id="b-grv-v">9.80</span>
      </div>
      <div class="item">
        <span class="lb">阻尼</span>
        <input type="range" id="b-dmp" min="0" max="0.01" step="0.0005" value="0.002">
        <span class="vv" id="b-dmp-v">0.002</span>
      </div>
      <button id="b-reset">重置摆动</button>
    </div>
  </main>

  <aside id="panel">
    <h1>双摆模拟器<small>Double Pendulum · 混沌仿真</small></h1>

    <div class="readout">
      <div class="cell"><div class="k">θ₁ (°)</div><div class="v" id="v-t1">0.0</div></div>
      <div class="cell"><div class="k">θ₂ (°)</div><div class="v" id="v-t2">0.0</div></div>
      <div class="cell"><div class="k">ω₁ (°/s)</div><div class="v" id="v-w1">0.0</div></div>
      <div class="cell"><div class="k">ω₂ (°/s)</div><div class="v" id="v-w2">0.0</div></div>
      <div class="cell"><div class="k">机械能 E</div><div class="v" id="v-eng">0.000</div></div>
      <div class="cell"><div class="k">仿真时间 (s)</div><div class="v" id="v-tim">0.0</div></div>
    </div>

    <div class="group">
      <div class="row">
        <label>初始 θ₁ <b id="a1-val">90°</b></label>
        <input type="range" id="s-a1" min="5" max="175" step="1" value="90">
      </div>
      <div class="row">
        <label>初始 θ₂ <b id="a2-val">90°</b></label>
        <input type="range" id="s-a2" min="5" max="175" step="1" value="90">
      </div>
      <div class="row">
        <label>时间倍率 <b id="s-val">1.00×</b></label>
        <input type="range" id="s-spd" min="0.25" max="2" step="0.05" value="1">
      </div>
    </div>

    <div>
      <div class="presets-label">天体预设</div>
      <div class="bodies">
        <button class="body-btn" data-preset="earth">
          <span class="dot" style="background:#4a9eff;color:#4a9eff"></span>
          <span class="name">地球</span><span class="gv">9.80</span>
        </button>
        <button class="body-btn" data-preset="moon">
          <span class="dot" style="background:#b8b8c0;color:#b8b8c0"></span>
          <span class="name">月球</span><span class="gv">1.62</span>
        </button>
        <button class="body-btn" data-preset="jupiter">
          <span class="dot" style="background:#ff9a3c;color:#ff9a3c"></span>
          <span class="name">木星</span><span class="gv">24.79</span>
        </button>
        <button class="body-btn" data-preset="space">
          <span class="dot" style="background:#0a0a14;color:#0a0a14;border:1px solid #4a5070"></span>
          <span class="name">太空</span><span class="gv">0.00</span>
        </button>
      </div>
    </div>

    <div class="btns">
      <button id="b-play">暂停</button>
      <button id="b-trail">清轨迹</button>
    </div>

    <div class="tip">
      直接拖动任一摆球改变初始角度；<kbd>空格</kbd> 暂停 / 继续，<kbd>R</kbd> 重置摆动。<br>
      双摆对初始条件极度敏感，呈现典型混沌行为；RK4 固定步长 1/480 s 积分。
    </div>
  </aside>
</div>

<script>
(function () {
  'use strict';

  // ---------- 常量 ----------
  var PPM       = 100;   // px per meter
  var DAMP_GAIN = 100;   // 滑块阻尼 b(0~0.01) → 物理 c = b × 100 (s⁻¹)
  var M1 = 1, M2 = 1;    // 两摆球质量 (kg)
  var FIXED     = 1/480; // RK4 步长 (s)

  // ---------- DOM ----------
  var cv  = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var wrap = document.getElementById('canvasWrap');

  var W = 0, H = 0, pivotX = 0, pivotY = 0;

  // ---------- 状态 ----------
  var L1 = 200, L2 = 200;        // 像素摆长
  var g = 9.8;
  var damp = 0.002, speed = 1;
  var theta1 = Math.PI / 2, theta2 = Math.PI / 2; // 初始 90° / 90°，经典混沌配置
  var omega1 = 0, omega2 = 0;
  var running = true, dragging = false;
  var simTime = 0;
  var trail = [];                // 仅记录 bob2 轨迹

  // ---------- 过渡与持久化 ----------
  var gTween     = null;          // { from, to, t0, dur } | null
  var saveTimer  = null;
  var STORAGE_KEY = 'week05_double_pendulum_v1';

  // ---------- 尺寸 ----------
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    W = wrap.clientWidth; H = wrap.clientHeight;
    cv.width  = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    pivotX = W / 2;
    pivotY = Math.max(60, H * 0.16);

    // 摆长上限：两段摆放下后须能容纳两球
    var maxL = Math.max(100, Math.min(350, Math.floor((H - pivotY - 60) / 2)));
    var sl = document.getElementById('b-len');
    sl.max = maxL;
    if (L1 > maxL) {
      L1 = L2 = maxL;
      sl.value = maxL;
      document.getElementById('b-len-v').textContent = L1 + ' px';
    }
  }
  window.addEventListener('resize', resize);

  // ---------- 物理：双摆拉格朗日动力学 ----------
  function derivatives(t1, o1, t2, o2) {
    var L1m = L1 / PPM, L2m = L2 / PPM;
    var d = t1 - t2;
    var cos2d = Math.cos(2 * d);
    var denom = 2 * M1 + M2 - M2 * cos2d;          // 范围 [2, 4]，永不为零
    var sin_d = Math.sin(d);
    var a1 = (
      -g * (2 * M1 + M2) * Math.sin(t1)
      - M2 * g * Math.sin(t1 - 2 * t2)
      - 2 * sin_d * M2 * (o2 * o2 * L2m + o1 * o1 * L1m * Math.cos(d))
    ) / (L1m * denom);
    var a2 = (
      2 * sin_d * (
        o1 * o1 * L1m * (M1 + M2)
        + g * (M1 + M2) * Math.cos(t1)
        + o2 * o2 * L2m * M2 * Math.cos(d)
      )
    ) / (L2m * denom);
    return {
      dt1: o1,
      do1: a1 - DAMP_GAIN * damp * o1,
      dt2: o2,
      do2: a2 - DAMP_GAIN * damp * o2
    };
  }

  function step(h) {
    var k1 = derivatives(theta1, omega1, theta2, omega2);
    var k2 = derivatives(
      theta1 + h * k1.dt1 / 2, omega1 + h * k1.do1 / 2,
      theta2 + h * k1.dt2 / 2, omega2 + h * k1.do2 / 2
    );
    var k3 = derivatives(
      theta1 + h * k2.dt1 / 2, omega1 + h * k2.do1 / 2,
      theta2 + h * k2.dt2 / 2, omega2 + h * k2.do2 / 2
    );
    var k4 = derivatives(
      theta1 + h * k3.dt1, omega1 + h * k3.do1,
      theta2 + h * k3.dt2, omega2 + h * k3.do2
    );
    theta1 += h / 6 * (k1.dt1 + 2 * k2.dt1 + 2 * k3.dt1 + k4.dt1);
    omega1 += h / 6 * (k1.do1 + 2 * k2.do1 + 2 * k3.do1 + k4.do1);
    theta2 += h / 6 * (k1.dt2 + 2 * k2.dt2 + 2 * k3.dt2 + k4.dt2);
    omega2 += h / 6 * (k1.do2 + 2 * k2.do2 + 2 * k3.do2 + k4.do2);
    simTime += h;
  }

  function bob1Pos() {
    return { x: pivotX + L1 * Math.sin(theta1), y: pivotY + L1 * Math.cos(theta1) };
  }
  function bob2Pos(b1) {
    return { x: b1.x + L2 * Math.sin(theta2), y: b1.y + L2 * Math.cos(theta2) };
  }

  // 机械能（含重力势能与动能），用于观察能量守恒 / 耗散
  function energy() {
    var L1m = L1 / PPM, L2m = L2 / PPM;
    var b1 = bob1Pos();
    var y1m = b1.y / PPM;
    var y2m = (b1.y + L2 * Math.cos(theta2)) / PPM;
    var v1x =  L1m * omega1 * Math.cos(theta1);
    var v1y = -L1m * omega1 * Math.sin(theta1);
    var v2x = v1x +  L2m * omega2 * Math.cos(theta2);
    var v2y = v1y -  L2m * omega2 * Math.sin(theta2);
    var T = 0.5 * M1 * (v1x * v1x + v1y * v1y) + 0.5 * M2 * (v2x * v2x + v2y * v2y);
    var V = M1 * g * y1m + M2 * g * y2m;
    return T + V;
  }

  // ---------- 绘制 ----------
  function drawGrid() {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 1;
    var s = 40;
    for (var x = (W / 2) % s; x < W; x += s) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (var y = 0; y < H; y += s) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawBob(x, y, R, glowColor, hi, lo) {
    ctx.save();
    ctx.shadowColor = glowColor;
    ctx.shadowBlur  = 22;
    var grd = ctx.createRadialGradient(x - R * 0.35, y - R * 0.4, R * 0.12, x, y, R);
    grd.addColorStop(0,   '#ffffff');
    grd.addColorStop(0.35, hi);
    grd.addColorStop(1,   lo);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(x, y, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(0, 0, W, H);
    drawGrid();

    var b1 = bob1Pos(), b2 = bob2Pos(b1);

    // 彩虹渐变衰减拖尾（仅 bob2）：色相随时间漂移，alpha 沿尾部衰减
    if (trail.length > 1) {
      ctx.save();
      ctx.lineCap = 'round';
      for (var i = 1; i < trail.length; i++) {
        var frac = i / trail.length;            // 0..1，靠近头部为 1
        var hue  = (simTime * 40 + frac * 360) % 360;
        var a    = frac * 0.85;
        ctx.strokeStyle = 'hsla(' + hue.toFixed(0) + ',90%,62%,' + a.toFixed(3) + ')';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
        ctx.lineTo(trail[i].x, trail[i].y);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 摆杆
    ctx.save();
    ctx.strokeStyle = 'rgba(160,175,200,0.7)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(103,232,249,0.25)';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(pivotX, pivotY);
    ctx.lineTo(b1.x, b1.y);
    ctx.lineTo(b2.x, b2.y);
    ctx.stroke();
    ctx.restore();

    // 摆球 1（青色发光）
    drawBob(b1.x, b1.y, 14, 'rgba(103,232,249,0.85)', '#a8f2ff', '#2fa8c9');
    // 摆球 2（橙色发光）
    drawBob(b2.x, b2.y, 14, 'rgba(255,160,80,0.85)',  '#ffe2b3', '#c97a2f');

    // 悬点
    ctx.save();
    ctx.fillStyle = '#8b93a8';
    ctx.beginPath(); ctx.arc(pivotX, pivotY, 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }

  // ---------- 主循环 ----------
  var acc = 0, last = 0;

  function frame(ts) {
    if (!last) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.1);
    last = ts;

    updateTween(); // no-op; tween 由 tweenGravity 内部 setTimeout 链驱动

    if (running && !dragging) {
      acc += dt * speed;
      var guard = 0;
      while (acc >= FIXED && guard++ < 1200) { step(FIXED); acc -= FIXED; }

      var b2 = bob2Pos(bob1Pos());
      var n = trail.length;
      if (!n || Math.hypot(b2.x - trail[n - 1].x, b2.y - trail[n - 1].y) > 1.5) {
        trail.push({ x: b2.x, y: b2.y });
        if (trail.length > 220) trail.shift();
      }
    }

    draw();
    updateReadout();
    requestAnimationFrame(frame);
  }

  var el = {
    t1: document.getElementById('v-t1'), t2: document.getElementById('v-t2'),
    w1: document.getElementById('v-w1'), w2: document.getElementById('v-w2'),
    eng: document.getElementById('v-eng'), tim: document.getElementById('v-tim')
  };
  function updateReadout() {
    el.t1.textContent = (theta1 * 180 / Math.PI).toFixed(1);
    el.t2.textContent = (theta2 * 180 / Math.PI).toFixed(1);
    el.w1.textContent = (omega1 * 180 / Math.PI).toFixed(1);
    el.w2.textContent = (omega2 * 180 / Math.PI).toFixed(1);
    el.eng.textContent = energy().toFixed(3);
    el.tim.textContent = simTime.toFixed(1);
  }

  // ---------- 交互 ----------
  function reset() {
    theta1 = Math.PI / 2; theta2 = Math.PI / 2;
    omega1 = 0; omega2 = 0; simTime = 0; acc = 0;
    trail.length = 0;
  }

  function resetToDefault() {
    var s1 = document.getElementById('s-a1');
    var s2 = document.getElementById('s-a2');
    s1.value = 90; document.getElementById('a1-val').textContent = '90°';
    s2.value = 90; document.getElementById('a2-val').textContent = '90°';
    reset();
    scheduleSave();
  }

  // ---------- 天体预设：平滑过渡 g ----------
  var PRESETS = {
    earth:   { g: 9.80 },
    moon:    { g: 1.62 },
    jupiter: { g: 24.79 },
    space:   { g: 0.00 }
  };

  function tweenGravity(targetG, dur) {
    // 取消进行中的过渡；新 tween 接管
    gTween = null;
    var tweenObj = { from: g, to: targetG };
    gTween = tweenObj;
    var STEPS = 28;
    var stepMs = (dur || 0.7) * 1000 / STEPS;
    var step = 0;
    function tick() {
      if (gTween !== tweenObj) return; // 被手动滑块或新 tween 取消
      step++;
      var k = step / STEPS;
      var e = 1 - Math.pow(1 - k, 3); // ease-out cubic
      g = tweenObj.from + (tweenObj.to - tweenObj.from) * e;
      var s = document.getElementById('b-grv');
      var l = document.getElementById('b-grv-v');
      s.value = g; l.textContent = g.toFixed(2);
      if (k >= 1) {
        g = tweenObj.to; gTween = null;
        detectActivePreset();
      } else {
        setTimeout(tick, stepMs);
      }
    }
    setTimeout(tick, stepMs);
  }

  // rAF 解耦：tween 由 tweenGravity 内部 setTimeout 链驱动；
  // 保留该函数为 no-op 仅为 API 兼容。
  function updateTween() { /* no-op */ }

  function setActivePreset(name) {
    var btns = document.querySelectorAll('.body-btn');
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].getAttribute('data-preset') === name) btns[i].classList.add('active');
      else btns[i].classList.remove('active');
    }
  }
  function clearActivePresets() {
    var btns = document.querySelectorAll('.body-btn');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  }
  function detectActivePreset() {
    var best = null, bestErr = 0.05;
    for (var k in PRESETS) {
      var err = Math.abs(g - PRESETS[k].g);
      if (err < bestErr) { best = k; bestErr = err; }
    }
    if (best) setActivePreset(best); else clearActivePresets();
  }

  // ---------- 持久化 ----------
  function saveState() {
    try {
      var data = {
        L: L1, g: g, damp: damp, speed: speed,
        theta1Deg: Math.round(Math.abs(theta1) * 180 / Math.PI),
        theta2Deg: Math.round(Math.abs(theta2) * 180 / Math.PI)
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { /* 隐私模式或配额满：静默 */ }
  }
  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(saveState, 120);
  }
  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function syncSliders() {
    function set(id, valId, val, fmt) {
      var s = document.getElementById(id), l = document.getElementById(valId);
      s.value = val; l.textContent = fmt(val);
    }
    set('b-len', 'b-len-v', L1, function (n) { return n + ' px'; });
    set('b-grv', 'b-grv-v', g,  function (n) { return n.toFixed(2); });
    set('b-dmp', 'b-dmp-v', damp, function (n) { return n.toFixed(3); });
    set('s-spd', 's-val',   speed, function (n) { return n.toFixed(2) + '×'; });
    set('s-a1', 'a1-val',   Math.round(Math.abs(theta1) * 180 / Math.PI), function (n) { return n + '°'; });
    set('s-a2', 'a2-val',   Math.round(Math.abs(theta2) * 180 / Math.PI), function (n) { return n + '°'; });
  }

  // ---------- 预设按钮事件 ----------
  (function setupPresets() {
    var btns = document.querySelectorAll('.body-btn');
    for (var i = 0; i < btns.length; i++) {
      (function (btn) {
        var name = btn.getAttribute('data-preset');
        btn.addEventListener('click', function () {
          var p = PRESETS[name];
          if (!p) return;
        tweenGravity(p.g);
          setActivePreset(name);
          scheduleSave();
        });
      })(btns[i]);
    }
  })();

  function bindSlider(id, valId, fmt, onInput) {
    var s = document.getElementById(id), v = document.getElementById(valId);
    s.addEventListener('input', function () {
      var n = parseFloat(s.value);
      v.textContent = fmt(n);
      onInput(n);
    });
  }

  bindSlider('b-len', 'b-len-v', function (n) { return n + ' px'; }, function (n) { L1 = L2 = n; scheduleSave(); });
  bindSlider('b-grv', 'b-grv-v', function (n) { return n.toFixed(2); }, function (n) {
    g = n; gTween = null; clearActivePresets(); scheduleSave();
  });
  bindSlider('b-dmp', 'b-dmp-v', function (n) { return n.toFixed(3); }, function (n) { damp = n; scheduleSave(); });
  bindSlider('s-spd', 's-val', function (n) { return n.toFixed(2) + '×'; }, function (n) { speed = n; scheduleSave(); });
  bindSlider('s-a1', 'a1-val', function (n) { return n + '°'; }, function (n) {
    theta1 = n * Math.PI / 180; omega1 = omega2 = 0; simTime = 0; trail.length = 0; scheduleSave();
  });
  bindSlider('s-a2', 'a2-val', function (n) { return n + '°'; }, function (n) {
    theta2 = n * Math.PI / 180; omega1 = omega2 = 0; simTime = 0; trail.length = 0; scheduleSave();
  });

  var btnPlay = document.getElementById('b-play');
  btnPlay.addEventListener('click', function () {
    running = !running;
    btnPlay.textContent = running ? '暂停' : '继续';
  });
  document.getElementById('b-reset').addEventListener('click', resetToDefault);
  document.getElementById('b-trail').addEventListener('click', function () { trail.length = 0; });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); btnPlay.click(); }
    if (e.key === 'r' || e.key === 'R') resetToDefault();
  });

  // ---------- 拖拽：识别最近摆球并通过逆运动学保持约束 ----------
  var dragTarget   = null; // 'bob1' | 'bob2'
  var dragBob2Snap = null; // 拖 bob1 时锁定 bob2 位置

  function localPos(e) {
    var r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  cv.addEventListener('pointerdown', function (e) {
    var p = localPos(e);
    var b1 = bob1Pos(), b2 = bob2Pos(b1);
    var d1 = Math.hypot(p.x - b1.x, p.y - b1.y);
    var d2 = Math.hypot(p.x - b2.x, p.y - b2.y);
    if (d1 < 36 && d1 <= d2) {
      dragTarget = 'bob1';
      dragBob2Snap = { x: b2.x, y: b2.y };
    } else if (d2 < 36) {
      dragTarget = 'bob2';
    } else {
      return;
    }
    dragging = true;
    cv.classList.add('dragging');
    cv.setPointerCapture(e.pointerId);
    omega1 = omega2 = 0; simTime = 0; acc = 0;
  });
  cv.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = localPos(e);
    if (dragTarget === 'bob1') {
      var dx1 = p.x - pivotX, dy1 = p.y - pivotY;
      if (dy1 < 12) dy1 = 12;
      theta1 = Math.atan2(dx1, dy1);
      theta1 = Math.max(-Math.PI * 0.49, Math.min(Math.PI * 0.49, theta1));
      // 逆运动学：让 bob2 保持原位置
      var nb1x = pivotX + L1 * Math.sin(theta1);
      var nb1y = pivotY + L1 * Math.cos(theta1);
      var dx2 = dragBob2Snap.x - nb1x;
      var dy2 = dragBob2Snap.y - nb1y;
      if (dy2 < 12) dy2 = 12;
      theta2 = Math.atan2(dx2, dy2);
      theta2 = Math.max(-Math.PI * 0.49, Math.min(Math.PI * 0.49, theta2));
    } else if (dragTarget === 'bob2') {
      var b1 = bob1Pos();
      var dx2 = p.x - b1.x, dy2 = p.y - b1.y;
      if (dy2 < 12) dy2 = 12;
      theta2 = Math.atan2(dx2, dy2);
      theta2 = Math.max(-Math.PI * 0.49, Math.min(Math.PI * 0.49, theta2));
    }
    omega1 = omega2 = 0;
    // 同步初始角度滑块
    var d1 = Math.round(Math.abs(theta1) * 180 / Math.PI);
    var d2 = Math.round(Math.abs(theta2) * 180 / Math.PI);
    document.getElementById('s-a1').value = d1;
    document.getElementById('a1-val').textContent = d1 + '°';
    document.getElementById('s-a2').value = d2;
    document.getElementById('a2-val').textContent = d2 + '°';
  });
  cv.addEventListener('pointerup', function () {
    dragging = false; dragTarget = null; dragBob2Snap = null;
    cv.classList.remove('dragging');
    simTime = 0; acc = 0;
    scheduleSave();
  });

  resize();
  // 恢复上次会话参数（localStorage）
  var saved = loadState();
  if (saved) {
    if (typeof saved.L    === 'number') L1 = L2 = saved.L;
    if (typeof saved.g    === 'number') g   = saved.g;
    if (typeof saved.damp === 'number') damp = saved.damp;
    if (typeof saved.speed === 'number') speed = saved.speed;
    if (typeof saved.theta1Deg === 'number') theta1 = saved.theta1Deg * Math.PI / 180;
    if (typeof saved.theta2Deg === 'number') theta2 = saved.theta2Deg * Math.PI / 180;
    omega1 = 0; omega2 = 0; simTime = 0; acc = 0;
    syncSliders();
  } else {
    // 首次访问：默认初始角 90°/90°
    theta1 = Math.PI / 2; theta2 = Math.PI / 2;
    omega1 = 0; omega2 = 0; simTime = 0; acc = 0;
  }
  detectActivePreset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
